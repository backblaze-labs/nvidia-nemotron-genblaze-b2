[project]
name = "nvidia-nemotron-genblaze-b2-api"
version = "0.2.0"
description = "FastAPI service that drives a Genblaze pipeline keyed off NVIDIA Nemotron 3 Nano Omni's multimodal perception, fanning out to image / TTS / music generation with all assets persisted to Backblaze B2."
requires-python = ">=3.11"
dependencies = [
  # 0.3.x preflight rationale: docs/features/video-best-effort.md.
  "genblaze-core>=0.3.6,<0.3.8",
  # 0.3.6 floor: keeps genblaze-s3 aligned with the patched 0.3.x floor.
  "genblaze-s3>=0.3.6,<0.4",
  # 0.3.0 floor: no newer 0.3.x NVIDIA patch is required by this sample.
  "genblaze-nvidia[chat]>=0.3,<0.3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.31",
  "httpx>=0.27",
  "idna>=3.15",
  "pillow>=12.3.0",
  "starlette>=1.3.1",
  "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
